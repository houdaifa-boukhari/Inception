worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;  # Ensure MIME types are loaded
    default_type application/octet-stream;  # Default MIME type

    server {
        listen 443 ssl;
        server_name hel-bouk.42.fr;

        ssl_certificate /etc/nginx/nginx.crt;
        ssl_certificate_key /etc/nginx/nginx.key;

        root /var/www/html;
        index index.php index.html index.htm;

        # Serve static files correctly
        location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|otf|webp|mp4|webm|avif)$ {
            root /var/www/html;
            expires max;
            add_header Cache-Control "public, max-age=31536000";
            try_files $uri =404;
        }

        # Handle main requests
        location / {
            try_files $uri $uri/ /index.php?$args;
        }

        # Handle PHP processing
        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass wordpress:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
        }
    }
}

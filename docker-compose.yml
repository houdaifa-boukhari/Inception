version: '3.8'

services:
  nginx:
    build: ./srcs/requirements/nginx
    image: nginx:new 
    ports:
      - "443:443"
    networks:
      - inception
    depends_on:
      - wordpress
    restart: always
    volumes:
      - wordpress_data:/var/www/html


  wordpress:
    build: ./srcs/requirements/wordpress
    image: wordpress:new
    depends_on:
      - mariadb
    restart: always
    networks:
      - inception
    volumes:
      - wordpress_data:/var/www/html
    env_file:
      - .env

  mariadb:
    build: ./srcs/requirements/mariadb
    image: mariadb:new
    restart: always
    networks:
      - inception
    volumes:
      - db_data:/var/lib/mysql
    env_file:
      - .env 

networks:
  inception:
    driver: bridge

volumes:
  db_data:
    driver_opts:
      o: bind
      device: /home/hel-bouk/data/database
      type: none
  wordpress_data:
    driver_opts:
      o: bind
      device: /home/hel-bouk/data/wordpress
      type: none
